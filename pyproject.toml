[tool.poetry]
name = "online-school"
version = "0.1.0"
description = ""
authors = ["LimDmitriy <160336426+LimDmitriy@users.noreply.github.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
black = "^25.11.0"
dotenv = "^0.9.9"
psycopg2-binary = "^2.9.11"
pillow = "^12.0.0"
redis = "^7.1.0"
flake8 = "^7.3.0"
django = "^5.2.8"
djangorestframework = "^3.16.1"
isort = "^7.0.0"
django-filter = "^25.2"
djangorestframework-simplejwt = "^5.5.1"
drf-yasg = "^1.21.11"
stripe = "^14.1.0"
forex-python = "^1.9.2"
celery = "^5.6.0"
django-celery-beat = "^2.8.1"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.2"
pytest-django = "^4.11.1"
