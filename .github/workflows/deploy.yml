name: Django CI/CD

on:
  push:
    branches: [ develop ]

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest

    steps:
    # Клонируем репозиторий
    - uses: actions/checkout@v3

    # Устанавливаем Python
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: 3.12

    # Устанавливаем Poetry
    - name: Install Poetry
      run: |
        curl -sSL https://install.python-poetry.org | python3 -
        export PATH="$HOME/.local/bin:$PATH"
        poetry --version

    # Устанавливаем зависимости проекта
    - name: Install dependencies
      run: poetry install --no-root

    # Запуск тестов Django
    - name: Run Django tests
      run: |
        # Создаем папку tests, если нет
        mkdir -p tests
        # Пишем минимальный placeholder-тест
        echo "from django.test import SimpleTestCase\n\nclass PlaceholderTest(SimpleTestCase):\n    def test_placeholder(self):\n        self.assertTrue(True)" > tests/test_placeholder.py
        # Запуск тестов
        poetry run python manage.py test

    # Деплой на сервер (только если тесты успешны)
    - name: Deploy to server
      if: success()
      uses: appleboy/ssh-action@v0.1.7
      with:
        host: ${{ secrets.SERVER_IP }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        script: |
          cd ~/drf_project
          git pull origin develop
          poetry install --no-root
          poetry run python manage.py migrate
          sudo systemctl restart gunicorn
